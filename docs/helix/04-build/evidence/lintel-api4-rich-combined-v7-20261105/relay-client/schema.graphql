scalar Decimal

interface Node {
  id: ID!
}

type Note implements Node {
  amount: Decimal!
  enabled: Boolean!
  id: ID!
  owner: String!
  payload: String!
}

type NoteConnection {
  edges: [NoteEdge!]!
  pageInfo: PageInfo!
}

type NoteEdge {
  cursor: String!
  node: Note!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Query {
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  notes(after: String, first: Int = 25): NoteConnection!
  tasks(after: String, first: Int = 25): TaskConnection!
}

type Task implements Node {
  id: ID!
  taskValue: String!
}

type TaskConnection {
  edges: [TaskEdge!]!
  pageInfo: PageInfo!
}

type TaskEdge {
  cursor: String!
  node: Task!
}
