[project]
name = "lintel-api"
version = "0.1.0a7"
description = "Prepared GraphQL APIs over UMF-qualified execution ports"
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.135,<1",
  "graphql-core>=3.3,<3.4",
]

[project.optional-dependencies]
# `lintel prepare` and lintel.build: UMF validation and prepared-API issuing.
build = ["umf-core>=0.10.0,<0.11"]
# `lintel serve`.
serve = ["uvicorn>=0.30"]
# lintel.experimental (laboratory projection; not a production API).
experimental = ["strawberry-graphql>=0.339,<1", "umf-core>=0.10.0,<0.11"]

[project.scripts]
lintel = "lintel.cli:main"

[project.urls]
Repository = "https://github.com/DocumentDrivenDX/lintel"
Issues = "https://github.com/DocumentDrivenDX/lintel/issues"
Changelog = "https://github.com/DocumentDrivenDX/lintel/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel"]

[tool.hatch.build.targets.sdist]
include = ["src/", "scripts/", "tests/", "docs/", "README.md", "CHANGELOG.md", "AGENTS.md", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
  "pyright==1.1.414",
  "httpx==0.28.1",
  "jsonschema>=4",
  "umf-core>=0.10.0,<0.11",
  "uvicorn>=0.30",
  "strawberry-graphql>=0.339,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["docs"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR"]
preview = true
explicit-preview-rules = true
extend-select = ["PLR0904"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 40
max-public-methods = 15

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]
