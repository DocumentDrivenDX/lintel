[project]
name = "lintel-api"
version = "0.1.0a1"
description = "UMF-driven GraphQL interoperability spikes (not a production runtime)"
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "umf-core==0.10.0",
  "strawberry-graphql==0.339.1",
  "graphql-core==3.3.1",
]

[project.urls]
Repository = "https://github.com/DocumentDrivenDX/lintel"
Issues = "https://github.com/DocumentDrivenDX/lintel/issues"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel"]

[tool.hatch.build.targets.sdist]
include = [".github/", "src/", "spikes/", "scripts/", "tests/", "docs/", "README.md", "AGENTS.md", ".helix.yml", "pyproject.toml", "uv.lock"]

[dependency-groups]
spike = [
  "umf-core==0.10.0",
  "strawberry-graphql==0.339.1",
  "fastapi==0.135.1",
  "graphql-core==3.3.1",
  "httpx==0.28.1",
]
native-spike = [
  "umf-access==0.1.0.dev8", "umf-codegen==0.1.0a5", "weft-sql==0.4.54",
  "psycopg[binary]==3.3.6", "pgserver-pg18==18.6.1",
]
dev = ["pytest==9.2.0", "ruff==0.17.3", "pyright==1.1.414"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
extend-exclude = ["docs"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR"]
preview = true
explicit-preview-rules = true
extend-select = ["PLR0904"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 40
max-public-methods = 15

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "spikes", "scripts", "tests"]

[tool.uv]
find-links = ["https://github.com/DocumentDrivenDX/pgserver/releases/expanded_assets/pg18.6-pgv0.8.6-r2"]

[tool.uv.sources]
umf-access = { url = "https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.8/umf_access-0.1.0.dev8-py3-none-any.whl" }
umf-codegen = { url = "https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.8/umf_codegen-0.1.0a5-py3-none-any.whl" }
