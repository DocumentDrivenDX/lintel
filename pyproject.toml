[project]
name = "lintel-api"
version = "0.0.0"
description = "UMF-driven GraphQL interoperability spikes (not a production runtime)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
spike = [
  "umf-core==0.10.0",
  "strawberry-graphql==0.339.1",
  "fastapi==0.135.1",
  "graphql-core==3.3.1",
  "httpx==0.28.1",
]
dev = ["pytest==9.2.0", "ruff==0.17.3", "pyright==1.1.414"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["docs"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR"]
preview = true
explicit-preview-rules = true
extend-select = ["PLR0904"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 40
max-public-methods = 15

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["spikes", "scripts", "tests"]
