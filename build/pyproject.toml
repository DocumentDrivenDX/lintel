[project]
name = "lintel-api-build"
version = "0.1.0a4"
description = "Build-time UMF admission and prepared API artifact issuer"
requires-python = ">=3.11"
dependencies = [
  "lintel-api==0.1.0a5",
  "umf-core==0.10.0",
  "graphql-core==3.3.1",
  "umf-access-generated-executor==0.1.0a9",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lintel_build"]

[tool.hatch.build.targets.sdist]
include = ["src/lintel_build/"]
