name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.3'
      - run: uv sync --locked --group spike --python 3.11
      - run: uv run --locked python -m ruff check src scripts spikes tests
      - run: uv run --locked python -m ruff format --check src scripts spikes tests
      - run: uv run --locked python scripts/check_boundaries.py
      - run: uv run --locked python scripts/check_tree_size.py
      - run: uv run --locked python -m pytest -q
